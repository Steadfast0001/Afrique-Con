name: Gateway tests

on:
  push:
    paths:
      - 'gateway/**'
  pull_request:
    paths:
      - 'gateway/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r gateway/requirements.txt
      - name: Run gateway tests
        run: |
          cd gateway
          pytest -q