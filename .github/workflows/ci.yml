name: CI Pipeline

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop

jobs:
  # ============================================================
  # FRONTEND  — Node 20 · Vite build · Playwright E2E
  # ============================================================
  frontend-ci:
    name: Frontend CI (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npx eslint src --ext .js,.jsx --max-warnings=0 || echo "No ESLint config found – skipping"

      - name: Build (Vite)
        run: npm run build
        env:
          VITE_API_BASE: http://localhost:8001

  # ============================================================
  # GATEWAY  — Python 3.11 · flake8 · pytest (43 tests)
  # ============================================================
  gateway-ci:
    name: Gateway CI (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: gateway/requirements.txt

      - name: Install Dependencies
        working-directory: ./gateway
        run: pip install -r requirements.txt pytest pytest-anyio flake8

      - name: Lint — fatal errors only (flake8 E9/F63/F7/F82)
        working-directory: ./gateway
        run: |
          flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics \
            --exclude=__pycache__,.venv,node_modules

      - name: Lint — style warnings (flake8 full)
        working-directory: ./gateway
        run: |
          flake8 . \
            --max-line-length=120 \
            --extend-ignore=E501,W503 \
            --exclude=__pycache__,.venv,node_modules \
            --count --statistics || true

      - name: Test (pytest)
        working-directory: ./gateway
        run: pytest tests/ -v --tb=short
        env:
          BRANCH_ROUTES: '{"buea":"http://localhost:8000","douala":"http://localhost:8001"}'
          AUTH_JWT_SECRET: test-secret-key-that-is-long-enough-32chars

  # ============================================================
  # BRANCH-BACKEND  — Python 3.11 · flake8 · pytest
  # ============================================================
  branch-backend-ci:
    name: Branch Backend CI (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: branch-backend/requirements.txt

      - name: Install Dependencies
        working-directory: ./branch-backend
        run: pip install -r requirements.txt PyJWT bcrypt pytest flake8

      - name: Lint — fatal errors only (flake8 E9/F63/F7/F82)
        working-directory: ./branch-backend
        run: |
          flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics \
            --exclude=__pycache__,.venv

      - name: Lint — style warnings (flake8 full)
        working-directory: ./branch-backend
        run: |
          flake8 . \
            --max-line-length=120 \
            --extend-ignore=E501,W503 \
            --exclude=__pycache__,.venv \
            --count --statistics || true

      - name: Test (pytest)
        working-directory: ./branch-backend
        run: pytest tests/ -v --tb=short
        env:
          BRANCH_DB_USE_SQLITE: "1"
          AUTH_JWT_SECRET: test-secret-key-that-is-long-enough-32chars
