name: CI Pipeline

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  frontend-ci:
    name: Frontend CI (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
        continue-on-error: true # Allow fallback if no package-lock.json exists yet

      - name: Install Dependencies
        run: |
          if [ -f package.json ]; then
            npm install
          else
            echo "No package.json found. Skipping npm install."
          fi

      - name: Lint
        run: |
          if [ -f package.json ]; then
            npm run lint --if-present
          else
            echo "Skipping lint."
          fi

      - name: Test
        run: |
          if [ -f package.json ]; then
            npm run test --if-present
          else
            echo "Skipping test."
          fi

      - name: Build
        run: |
          if [ -f package.json ]; then
            npm run build --if-present
          else
            echo "Skipping build."
          fi

  gateway-ci:
    name: Gateway CI (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./gateway
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: './gateway/requirements.txt'
        continue-on-error: true

      - name: Install Dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install flake8 pytest
          fi

      - name: Lint
        run: |
          # Run flake8. If python files are present, check syntax.
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || echo "No python files or lint passed"

      - name: Test
        run: |
          if [ -d tests ] || ls test_*.py 1> /dev/null 2>&1; then
            pytest
          else
            echo "No tests found. Skipping."
          fi

  branch-backend-ci:
    name: Branch Backend CI (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./branch-backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: './branch-backend/requirements.txt'
        continue-on-error: true

      - name: Install Dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install flake8 pytest
          fi

      - name: Lint
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || echo "No python files or lint passed"

      - name: Test
        run: |
          if [ -d tests ] || ls test_*.py 1> /dev/null 2>&1; then
            pytest
          else
            echo "No tests found. Skipping."
          fi
