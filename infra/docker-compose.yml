version: '3.8'

services:
  # =========================================================================
  # BUEA BRANCH STAGING DATABASE & POOLER
  # =========================================================================
  postgres_buea:
    image: postgres:15-alpine
    container_name: postgres_buea_staging
    restart: always
    environment:
      POSTGRES_USER: ${BUEA_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${BUEA_DB_PASSWORD:-postgres_buea_secure_pwd}
      POSTGRES_DB: ${BUEA_DB_NAME:-buea_db}
    volumes:
      - postgres_buea_data:/var/lib/postgresql/data
    networks:
      - buea_internal

  pgbouncer_buea:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer_buea_staging
    restart: always
    environment:
      - DB_USER=${BUEA_DB_USER:-postgres}
      - DB_PASSWORD=${BUEA_DB_PASSWORD:-postgres_buea_secure_pwd}
      - DB_HOST=postgres_buea
      - DB_PORT=5432
      - DB_NAME=${BUEA_DB_NAME:-buea_db}
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=100
      - DEFAULT_POOL_SIZE=20
      - LISTEN_PORT=5432
    ports:
      - "5433:5432" # Accessible externally via port 5433
    depends_on:
      - postgres_buea
    networks:
      - buea_internal
      - public_net

  # =========================================================================
  # DOUALA AKWA BRANCH STAGING DATABASE & POOLER
  # =========================================================================
  postgres_douala:
    image: postgres:15-alpine
    container_name: postgres_douala_staging
    restart: always
    environment:
      POSTGRES_USER: ${DOUALA_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DOUALA_DB_PASSWORD:-postgres_douala_secure_pwd}
      POSTGRES_DB: ${DOUALA_DB_NAME:-douala_db}
    volumes:
      - postgres_douala_data:/var/lib/postgresql/data
    networks:
      - douala_internal

  pgbouncer_douala:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer_douala_staging
    restart: always
    environment:
      - DB_USER=${DOUALA_DB_USER:-postgres}
      - DB_PASSWORD=${DOUALA_DB_PASSWORD:-postgres_douala_secure_pwd}
      - DB_HOST=postgres_douala
      - DB_PORT=5432
      - DB_NAME=${DOUALA_DB_NAME:-douala_db}
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=100
      - DEFAULT_POOL_SIZE=20
      - LISTEN_PORT=5432
    ports:
      - "5434:5432" # Accessible externally via port 5434
    depends_on:
      - postgres_douala
    networks:
      - douala_internal
      - public_net

# =========================================================================
# VOLUMES & NETWORKS
# =========================================================================
volumes:
  postgres_buea_data:
  postgres_douala_data:

networks:
  # Private networks to isolate direct Postgres DB nodes
  buea_internal:
    internal: true
  douala_internal:
    internal: true
  # Shared network for gateway, backend services, and poolers
  public_net:
    driver: bridge
