# =========================================================================
# Redis Staging Configuration
# =========================================================================

# Networking
port 6379
bind 0.0.0.0

# Memory Management & Eviction Policy
# Set memory limit to 256MB for staging environment
maxmemory 256mb

# Eviction Policy: allkeys-lru (Evicts any key based on LRU when maxmemory is reached)
# Ideal for search index cache to keep most recently requested index keys
maxmemory-policy allkeys-lru

# Persistence (optional snapshotting for backup recovery)
save 900 1
save 300 10
dbfilename dump.rdb
dir /data
